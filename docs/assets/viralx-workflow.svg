<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">ViralX 证据优先串联分析流程</title>
  <desc id="desc">关键词通过 TikTok Scraper7 发现候选视频，视频直链跳过搜索；ViralX Worker 固定使用 TK Note 下载真实原片，ShotLoom Core 切镜抽帧，再由上方视觉模型识别逐镜事实并基于合并证据终审。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F0F0F" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F0F0F"/>
    </marker>
    <style>
      .latin { font-family: "Hanken Grotesk", Inter, Arial, sans-serif; }
      .cn { font-family: "Hanken Grotesk", "Noto Sans SC", "PingFang SC", "Microsoft YaHei UI", sans-serif; }
      .label { font-size: 18px; font-weight: 700; letter-spacing: .08em; }
      .small { font-size: 18px; font-weight: 600; }
      .body { font-size: 19px; font-weight: 500; }
      .muted { fill: #656565; }
      .line { fill: none; stroke: #0F0F0F; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #656565; stroke-width: 3; stroke-dasharray: 9 10; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="940" rx="36" fill="#EDEDED"/>
  <circle cx="1494" cy="94" r="38" fill="#F9ABFF"/>
  <circle cx="1538" cy="124" r="13" fill="#E9D352"/>
  <circle cx="1454" cy="132" r="8" fill="#4DC5E5"/>

  <g class="cn">
    <rect x="70" y="62" width="360" height="46" rx="23" fill="#0F0F0F"/>
    <text x="94" y="92" class="label" fill="#FAFAFA">VIRALX · EVIDENCE PIPELINE</text>
    <text x="70" y="174" font-size="54" font-weight="700" fill="#0F0F0F">先完成证据，再允许模型判断</text>
    <text x="72" y="215" class="body muted">同一份真实原片贯穿采集和逐镜取证；证据不足就阻断，不用模型补空白。</text>
    <rect x="1242" y="160" width="286" height="54" rx="27" fill="#FAFAFA" stroke="#D8D8D8" stroke-width="2"/>
    <circle cx="1272" cy="187" r="7" fill="#63AD45"/>
    <text x="1291" y="194" class="small" fill="#0F0F0F">固定链路 · LibTV 仅故障回退</text>

    <rect x="70" y="264" width="258" height="74" rx="18" fill="#FAFAFA" stroke="#D8D8D8" stroke-width="2"/>
    <text x="94" y="294" font-size="15" font-weight="700" letter-spacing=".12em" fill="#656565">入口 A</text>
    <text x="94" y="321" font-size="22" font-weight="700" fill="#0F0F0F">输入搜索主题</text>

    <rect x="368" y="264" width="258" height="74" rx="18" fill="#FAFAFA" stroke="#D8D8D8" stroke-width="2"/>
    <text x="392" y="294" font-size="15" font-weight="700" letter-spacing=".12em" fill="#656565">入口 B</text>
    <text x="392" y="321" font-size="22" font-weight="700" fill="#0F0F0F">粘贴视频直链</text>

    <path d="M199 338 V371" class="line"/>
    <path d="M497 338 V355 C497 369 510 377 527 377 H557 V398" class="dash"/>
    <rect x="432" y="350" width="132" height="30" rx="15" fill="#E9D352"/>
    <text x="449" y="371" font-size="14" font-weight="700" fill="#0F0F0F">跳过 Scraper7</text>

    <rect x="352" y="374" width="874" height="346" rx="28" fill="none" stroke="#A7A7A7" stroke-width="2" stroke-dasharray="8 10"/>
    <rect x="666" y="354" width="198" height="40" rx="20" fill="#0F0F0F"/>
    <text x="690" y="381" font-size="16" font-weight="700" fill="#FAFAFA">ViralX Worker 串联</text>

    <g filter="url(#shadow)">
      <rect x="70" y="398" width="258" height="284" rx="24" fill="#FAFAFA"/>
      <rect x="368" y="398" width="258" height="284" rx="24" fill="#FAFAFA"/>
      <rect x="666" y="398" width="258" height="284" rx="24" fill="#1E1E1E"/>
      <rect x="964" y="398" width="242" height="284" rx="24" fill="#F9ABFF"/>
      <rect x="1246" y="398" width="284" height="284" rx="24" fill="#4DC5E5"/>
    </g>

    <text x="94" y="438" class="label" fill="#656565">01 · SEARCH</text>
    <text x="94" y="485" font-size="29" font-weight="700" fill="#0F0F0F">Scraper7</text>
    <text x="94" y="517" font-size="21" font-weight="700" fill="#0F0F0F">发现候选视频</text>
    <line x1="94" y1="548" x2="304" y2="548" stroke="#D8D8D8" stroke-width="2"/>
    <text x="94" y="583" class="body muted">仅关键词入口调用</text>
    <text x="94" y="614" class="body muted">输出视频 URL、热度</text>
    <text x="94" y="645" class="body muted">与基础平台数据</text>

    <text x="392" y="438" class="label" fill="#656565">02 · COLLECT</text>
    <text x="392" y="485" font-size="29" font-weight="700" fill="#0F0F0F">TK Note</text>
    <text x="392" y="517" font-size="21" font-weight="700" fill="#0F0F0F">采集平台证据</text>
    <line x1="392" y1="548" x2="602" y2="548" stroke="#D8D8D8" stroke-width="2"/>
    <text x="392" y="583" class="body muted">原片 · 元数据 · 评论</text>
    <text x="392" y="614" class="body muted">字幕 / ASR · 资产清单</text>
    <text x="392" y="645" class="body muted">兼容链接可回退 yt-dlp</text>

    <text x="690" y="438" class="label" fill="#B8B8B8">03 · EVIDENCE</text>
    <text x="690" y="485" font-size="29" font-weight="700" fill="#FAFAFA">ShotLoom + 模型</text>
    <text x="690" y="517" font-size="21" font-weight="700" fill="#FAFAFA">切镜并识别逐镜事实</text>
    <line x1="690" y1="548" x2="900" y2="548" stroke="#3C3C3C" stroke-width="2"/>
    <text x="690" y="583" class="body" fill="#D6D6D6">ShotLoom 读取同一原片</text>
    <text x="690" y="614" class="body" fill="#D6D6D6">上方视觉模型识别关键帧</text>
    <text x="690" y="645" class="body" fill="#D6D6D6">LibTV 仅显式故障回退</text>

    <text x="988" y="438" class="label" fill="#0F0F0F">04 · MERGE</text>
    <text x="988" y="485" font-size="29" font-weight="700" fill="#0F0F0F">Evidence</text>
    <text x="988" y="517" font-size="21" font-weight="700" fill="#0F0F0F">统一证据合同</text>
    <line x1="988" y1="548" x2="1182" y2="548" stroke="#0F0F0F" stroke-opacity=".22" stroke-width="2"/>
    <text x="988" y="583" class="body" fill="#0F0F0F">平台数据 + TK Note</text>
    <text x="988" y="614" class="body" fill="#0F0F0F">+ 逐镜视觉事实</text>
    <text x="988" y="645" class="body" fill="#0F0F0F">evidence_bundle.v1</text>

    <text x="1270" y="438" class="label" fill="#0F0F0F">05 · ANALYZE</text>
    <text x="1270" y="485" font-size="29" font-weight="700" fill="#0F0F0F">模型 API</text>
    <text x="1270" y="517" font-size="21" font-weight="700" fill="#0F0F0F">基于完整证据终审</text>
    <line x1="1270" y1="548" x2="1506" y2="548" stroke="#0F0F0F" stroke-opacity=".22" stroke-width="2"/>
    <text x="1270" y="583" class="body" fill="#0F0F0F">复用上方同一视觉模型</text>
    <text x="1270" y="614" class="body" fill="#0F0F0F">只接收命名证据文本</text>
    <text x="1270" y="645" class="body" fill="#0F0F0F">引用不足即拦截报告</text>

    <path d="M328 540 H356" class="line"/>
    <path d="M626 540 H654" class="line"/>
    <path d="M924 540 H952" class="line"/>
    <path d="M1206 540 H1234" class="line"/>

    <rect x="70" y="756" width="260" height="54" rx="27" fill="#E9D352"/>
    <text x="94" y="790" class="small" fill="#0F0F0F">Scraper7 只负责搜索发现</text>
    <text x="366" y="789" class="small muted">全程返回 NDJSON 五阶段真实进度</text>
    <path d="M1388 682 V736" class="line"/>

    <text x="70" y="880" font-size="15" font-weight="700" letter-spacing=".12em" fill="#656565">EDGEONE 浏览器界面</text>
    <line x1="278" y1="875" x2="544" y2="875" stroke="#A7A7A7" stroke-width="2"/>

    <rect x="834" y="742" width="152" height="62" rx="18" fill="#FAFAFA" stroke="#D8D8D8" stroke-width="2"/>
    <rect x="1002" y="742" width="152" height="62" rx="18" fill="#FAFAFA" stroke="#D8D8D8" stroke-width="2"/>
    <rect x="1170" y="742" width="152" height="62" rx="18" fill="#FAFAFA" stroke="#D8D8D8" stroke-width="2"/>
    <rect x="1338" y="742" width="192" height="62" rx="18" fill="#FAFAFA" stroke="#D8D8D8" stroke-width="2"/>
    <text x="867" y="780" class="small" fill="#0F0F0F">最终报告</text>
    <text x="1035" y="780" class="small" fill="#0F0F0F">复刻脚本</text>
    <text x="1185" y="780" class="small" fill="#0F0F0F">可选 LibTV 画布</text>
    <text x="1369" y="780" class="small" fill="#0F0F0F">Obsidian / MD</text>

    <text x="834" y="838" font-size="17" font-weight="600" fill="#656565">网页负责输入、状态与结果；完整分析由站点所有者的 ViralX Worker 执行。</text>
  </g>
</svg>
